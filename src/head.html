<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polski B1 — грамматика по экзаменам</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&amp;family=Manrope:wght@400..800&amp;display=swap">
<style>
:root {
  color-scheme: light;
  --ink: #192128;
  --muted: #565f67;
  --line: #e4e7ea;
  --control: #a7afb7;
  --correct: #205736;
  --wrong: #8b2925;
  --ui-font: Manrope, system-ui, "Segoe UI", sans-serif;
  font: 500 16px/1.6 var(--ui-font);
  color: var(--ink);
  background: #fff;
}
* { box-sizing: border-box; }
body { margin: 0; }
.shell {
  --accent: #245ab5;
  --tint: #edf5ff;
  --edge: #8fb2e4;
  --wash: color-mix(in srgb, var(--accent) 3%, #fff);
  --band: color-mix(in srgb, var(--accent) 6%, #fff);
}
.shell[data-palette="amber"] { --accent: #aa411e; --tint: #fff4ed; --edge: #c2866e; }
.shell[data-palette="graphite"] { --accent: #334155; --tint: #f2f5f8; --edge: #8c9aab; }
.shell[data-palette="iris"] { --accent: #643db1; --tint: #f6f1ff; --edge: #a68bd4; }
.shell[data-palette="lagoon"] { --accent: #006e61; --tint: #edf9f5; --edge: #6da496; }
a { color: var(--accent); text-underline-offset: .16em; }
:is(button, input, select, textarea, a, summary):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.top { border-bottom: 1px solid var(--line); }
.top-inner, .content {
  max-width: 840px;
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 32px);
}
.top-inner {
  min-height: 66px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding-block: 8px;
}
.brand { margin: 0; font-size: 21px; font-weight: 730; letter-spacing: -.05em; }
.brand b { padding-inline-end: 5px; color: var(--accent); font: italic 700 25px/1 Georgia, serif; }
.brand span { padding: 2px 6px; font-size: 12px; letter-spacing: 0; color: var(--accent); background: var(--tint); }
.palette { display: flex; align-items: center; gap: 8px; min-width: 0; border: 1px solid var(--line); padding: 0 9px 0 11px; }
.palette::before { content: ""; flex: none; width: 9px; height: 9px; background: var(--accent); }
.palette select { border: 0; background: #fff; color: var(--ink); min-height: 44px; font: inherit; cursor: pointer; }
.content { --inset: clamp(14px, 3.3vw, 26px); padding-block: clamp(12px, 3vw, 28px) 48px; }
.cover { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); background: var(--tint); overflow: hidden; }
.cover-copy { align-self: center; padding: clamp(14px, 4vw, 34px); }
.cover-kicker { margin: 0 0 11px; color: var(--accent); font-size: 13px; font-weight: 750; }
.cover h1 { margin: 0 0 11px; font: 400 clamp(33px, 6vw, 65px)/.98 Georgia, serif; letter-spacing: -.065em; }
.cover h1 em { display: block; color: var(--accent); }
.cover-caption { margin: 0; color: var(--muted); font-size: 14px; }
.cover-art {
  position: relative; isolation: isolate; display: grid; place-items: center; overflow: hidden;
  color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--tint));
}
.cover-orbit {
  position: absolute; z-index: -1; width: 78%; aspect-ratio: 1; border: 1px solid currentColor;
  border-radius: 50%; opacity: .32; transform: translate(8%, -8%);
}
.cover-orbit::after {
  content: ""; position: absolute; inset: 13%; border: 1px solid currentColor;
  border-radius: 50%; transform: translate(16%, 13%);
}
.cover-letter { font: italic 400 clamp(66px, 15vw, 160px)/1 Georgia, serif; transform: rotate(-9deg) translate(-4%, -4%); }
.cover-spark { position: absolute; top: 16%; right: 17%; font-size: clamp(14px, 3vw, 27px); }
.cover-edition { position: absolute; bottom: 8%; right: 12%; font: italic 16px Georgia, serif; white-space: nowrap; }
.browse-controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
  padding: 13px var(--inset) 15px;
  background: var(--band);
}
.browse-category { display: grid; min-width: 0; gap: 5px; color: var(--muted); font-size: 13px; font-weight: 600; }
.browse-controls select {
  width: 100%;
  min-height: 44px;
  padding: 6px 10px;
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--control);
  font: 500 16px/1.3 var(--ui-font);
}
.card { padding: var(--inset); border: 1px solid var(--line); border-top: 0; }
.exam-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 13px; }
.card h2 {
  margin: 6px 0;
  font: 500 clamp(27px, 4vw, 38px)/1.18 Lora, Georgia, serif;
  letter-spacing: -.035em;
  overflow-wrap: anywhere;
}
.muted { color: var(--muted); font-size: 14px; }
.card > .muted { margin: 5px 0; }
.word-bank { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 10px; margin-top: 12px; background: var(--wash); color: var(--muted); font-size: 13px; }
.word-bank [lang] { color: var(--ink); font-weight: 700; }
.passage { margin-top: 16px; font: 400 clamp(18px, 2.7vw, 22px)/2.3 Georgia, serif; overflow-wrap: anywhere; }
.blank { font-weight: 650; color: var(--accent); }
.inline-answer {
  max-width: 100%;
  min-height: 44px;
  margin: 2px 0;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-bottom-color: var(--edge);
  background: var(--tint);
  color: var(--accent);
  font: 600 16px/1.3 system-ui, sans-serif;
  vertical-align: baseline;
}
.inline-answer:not(:disabled):has(option:checked:not([value=""])) {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 15%, #fff);
}
.inline-answer:disabled { opacity: 1; }
.inline-answer.correct { border-color: #2e7549; background: #eaf7ee; color: var(--correct); }
.inline-answer.wrong { border-color: #b94742; background: #fdf0ee; color: var(--wrong); }
.inline-answer.skipped { border-color: var(--control); background: #f5f6f7; color: var(--muted); }
.inline-answer[type="text"] { width: min(100%, 18ch); }
.prompt-answer .inline-answer, textarea.inline-answer { width: 100%; }
textarea.inline-answer { resize: vertical; vertical-align: top; }
.prompt-fields { padding-inline-start: 24px; line-height: 1.65; }
.prompt-fields li { margin-bottom: 14px; }
.original-context { font-size: 15px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.original-context div { margin-top: 8px; }
summary { cursor: pointer; }
.inline-controls { margin-top: 22px; }
.check-row {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  margin-inline: calc(-1 * var(--inset)); padding: 13px var(--inset);
  border-block: 1px solid var(--line); background: var(--wash);
}
.check-row p { margin: 0; }
.check-progress { display: grid; gap: 5px; }
.check-progress progress { appearance: none; width: 104px; height: 4px; border: 0; background: var(--line); accent-color: var(--accent); }
.check-progress progress::-webkit-progress-bar { background: var(--line); }
.check-progress progress::-webkit-progress-value { background: var(--accent); }
button, select, input, textarea { border-radius: 0; }
.button, .exercise-navigation button, .error-export button, .accept-answer {
  min-height: 44px;
  border: 1px solid var(--control);
  background: #fff;
  color: var(--ink);
  padding: 8px 13px;
  font: inherit;
  cursor: pointer;
}
.button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 650; padding-inline: 16px; }
.button:hover:not(:disabled) { filter: brightness(.9); }
button:disabled { opacity: .5; cursor: default; }
.inline-results { margin: 14px 0; padding: 13px 15px; border-left: 2px solid var(--edge); background: var(--wash); overflow-wrap: anywhere; }
.inline-results h3 { margin-top: 0; }
.inline-results ol { padding-inline-start: 24px; }
.inline-results li { margin-bottom: 12px; }
.inline-results li p { margin: 4px 0; }
.inline-results li span { display: block; margin-top: 4px; }
.accept-answer { margin-top: 6px; }
.correct-answer { color: var(--correct); }
.wrong-answer { color: var(--wrong); }
.exercise-navigation { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.exercise-navigation button { background: var(--band); border-color: transparent; color: var(--accent); font-size: 13px; font-weight: 650; }
.exercise-navigation button:hover:not(:disabled) { border-color: var(--edge); }
.divider { border: 0; border-top: 1px solid var(--line); margin: 24px 0 12px; }
.source { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.source p { margin: 5px 0 0; }
.error-export {
  display: flex;
  align-items: center;
  gap: 8px 12px;
  flex-wrap: wrap;
  margin-top: 24px;
  color: var(--muted);
  font-size: 13px;
}
.catalog { margin-top: 22px; font-size: 14px; }
.catalog ul { padding-inline-start: 20px; }
.catalog li { margin-block: 4px; }
.catalog li span { margin-inline-start: 8px; color: var(--muted); }
@media (max-width: 600px) {
  .browse-controls { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .check-row { align-items: stretch; flex-direction: column; text-align: center; }
  .check-progress { grid-template-columns: 1fr auto; align-items: center; text-align: left; }
  .button { width: 100%; min-height: 48px; }
}
@media (prefers-reduced-motion: no-preference) {
  .inline-answer, .button { transition: background-color 160ms ease-out, border-color 160ms ease-out; }
  .check-progress progress::-webkit-progress-value { transition: width 180ms ease-out; }
  .inline-results:not([hidden]) { animation: reveal-result 200ms ease-out; }
}
@keyframes reveal-result {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="shell" id="trainer">
  <header class="top">
    <div class="top-inner">
      <div class="brand"><b aria-hidden="true">p.</b> Polski <span>B1</span></div>
      <label class="palette">
        <select id="palette-select" aria-label="Цветовая схема">
          <option value="sky">Небо</option>
          <option value="amber">Мандарин</option>
          <option value="graphite">Графит</option>
          <option value="iris">Ирис</option>
          <option value="lagoon">Лагуна</option>
        </select>
      </label>
    </div>
  </header>
  <main class="content">
    <section class="cover">
      <div class="cover-copy">
        <p class="cover-kicker">Грамматика · B1</p>
        <h1 lang="pl">Polski <em>w praktyce.</em></h1>
        <p class="cover-caption">Польский на примерах из экзаменов</p>
      </div>
      <div class="cover-art" aria-hidden="true">
        <div class="cover-orbit"></div><div class="cover-letter" lang="pl">Ł</div>
        <span class="cover-spark">✦</span><span class="cover-edition" lang="pl">ą · ć · ż</span>
      </div>
    </section>
